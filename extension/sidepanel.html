<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 16px;
      color: #1a1a1a;
      background: #fff;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      letter-spacing: -0.01em;
    }
    .gear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      border-radius: 4px;
      width: auto;
      margin: 0;
      display: flex;
      align-items: center;
    }
    .gear-btn:hover { color: #6b7280; background: #f3f4f6; }
    .gear-btn svg { width: 18px; height: 18px; }

    /* Views */
    .hidden { display: none !important; }

    /* Login View */
    .connect-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin-bottom: 0;
      transition: background 0.15s;
    }
    .connect-btn:hover { background: #1d4ed8; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: #9ca3af;
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .toggle-link {
      font-size: 13px;
      color: #2563eb;
      cursor: pointer;
      text-align: center;
      display: block;
      background: none;
      border: none;
      width: auto;
      padding: 0;
      margin: 0 auto;
    }
    .toggle-link:hover { text-decoration: underline; }

    .login-form {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .login-form.expanded {
      max-height: 300px;
      opacity: 1;
      margin-top: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border 0.15s;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: background 0.15s;
      margin-bottom: 0;
    }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status */
    .status {
      font-size: 13px;
      color: #6b7280;
      margin-top: 10px;
      min-height: 18px;
    }
    .status.error { color: #dc2626; }
    .status.success { color: #16a34a; }

    /* Idle message */
    .idle-message {
      text-align: center;
      padding: 32px 16px;
      color: #9ca3af;
      font-size: 14px;
    }
    .idle-message .icon {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.5;
    }

    /* Results list */
    .results {
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .field {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .field-label {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
    }
    .field-meta {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }
    .result-ok { border-left: 3px solid #16a34a; }
    .result-fail { border-left: 3px solid #dc2626; }
    .result-warn { border-left: 3px solid #f59e0b; background: #fffbeb; }
    .result-review { border-left: 3px solid #f97316; background: #fff7ed; }

    .review-actions { margin-top: 8px; }
    .review-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 6px;
      outline: none;
    }
    .review-input:focus { border-color: #2563eb; }
    .review-btns { display: flex; gap: 6px; }
    .btn-approve {
      width: auto;
      padding: 5px 12px;
      font-size: 12px;
      background: #dcfce7;
      color: #166534;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0;
    }
    .btn-approve:hover { background: #bbf7d0; }
    .btn-skip {
      width: auto;
      padding: 5px 12px;
      font-size: 12px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0;
    }
    .btn-skip:hover { background: #e5e7eb; }

    .review-submit-wrap { margin-top: 10px; }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
    }
    .logout-link {
      font-size: 12px;
      color: #9ca3af;
      cursor: pointer;
      background: none;
      border: none;
      width: auto;
      padding: 0;
      margin: 0;
    }
    .logout-link:hover { color: #dc2626; text-decoration: underline; }

    /* Settings overlay */
    .settings-panel {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .settings-panel label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }
    .settings-panel input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
    }
    .settings-panel input:focus { border-color: #2563eb; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>EasyFill</h1>
    <button id="settingsToggle" class="gear-btn hidden" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
    </button>
  </div>

  <!-- Settings panel (hidden by default) -->
  <div id="settingsPanel" class="settings-panel hidden">
    <label>Backend URL</label>
    <input id="backendUrl" type="text" value="http://localhost:8000" />
  </div>

  <!-- Login View -->
  <div id="loginView" class="hidden">
    <button id="connectWebBtn" class="connect-btn">Connect via EasyFill Web</button>
    <div class="divider">or</div>
    <button id="showLoginForm" class="toggle-link">Log in manually</button>
    <div id="loginForm" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Min 8 characters" />
      </div>
      <div id="loginStatus" class="status"></div>
      <button id="loginBtn" class="btn-primary" style="margin-top: 6px;">Log In</button>
    </div>
  </div>

  <!-- Logged In: Idle (not on Google Form) -->
  <div id="idleView" class="hidden">
    <div class="idle-message">
      <span class="icon">&#128196;</span>
      Open a Google Form to start filling.
    </div>
    <div class="footer">
      <button id="logoutBtnIdle" class="logout-link">Log out</button>
    </div>
  </div>

  <!-- Logged In: On a Google Form -->
  <div id="formView" class="hidden">
    <button id="fillBtn" class="btn-primary">Fill Form</button>
    <div id="status" class="status"></div>
    <div id="results" class="results"></div>
    <div class="footer">
      <button id="logoutBtnForm" class="logout-link">Log out</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
