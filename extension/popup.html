<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; color: #1a1a1a; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .status { font-size: 13px; color: #666; margin-bottom: 12px; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover:not(:disabled) { background: #e5e7eb; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover:not(:disabled) { background: #fecaca; }
    .fields { max-height: 300px; overflow-y: auto; margin: 12px 0; }
    .field { padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 6px; }
    .field-label { font-size: 13px; font-weight: 500; }
    .field-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .required { color: #dc2626; }
    .result-ok { border-left: 3px solid #16a34a; }
    .result-fail { border-left: 3px solid #dc2626; }
    .result-warn { border-left: 3px solid #f59e0b; background: #fffbeb; }
    .result-review { border-left: 3px solid #f97316; background: #fff7ed; }
    .review-actions { margin-top: 6px; }
    .review-input { width: 100%; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; margin-bottom: 4px; }
    .review-btns { display: flex; gap: 4px; }
    .btn-approve { width: auto; padding: 4px 10px; font-size: 11px; background: #dcfce7; color: #166534; border-radius: 4px; margin-bottom: 0; }
    .btn-approve:hover { background: #bbf7d0; }
    .btn-skip { width: auto; padding: 4px 10px; font-size: 11px; background: #f3f4f6; color: #374151; border-radius: 4px; margin-bottom: 0; }
    .btn-skip:hover { background: #e5e7eb; }
    .review-submit-wrap { margin-top: 8px; }
    .settings { margin-bottom: 12px; }
    .settings input { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; margin-top: 4px; }
    .settings label { font-size: 12px; color: #555; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
    .user-info { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 10px; margin-bottom: 12px; font-size: 13px; }
    .user-info .email { font-weight: 500; }
    .toggle-link { font-size: 12px; color: #2563eb; cursor: pointer; text-align: center; display: block; margin-top: 8px; }
    .toggle-link:hover { text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>EasyFill</h1>

  <!-- Auth View: Login -->
  <div id="loginView" class="hidden">
    <div class="form-group">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Min 8 characters" />
    </div>
    <div id="loginStatus" class="status"></div>
    <button id="loginBtn" class="btn-primary">Log In</button>
    <span id="showRegister" class="toggle-link">Don't have an account? Register</span>
  </div>

  <!-- Auth View: Register -->
  <div id="registerView" class="hidden">
    <div class="form-group">
      <label>First Name</label>
      <input id="regFirstName" type="text" placeholder="Optional" />
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input id="regLastName" type="text" placeholder="Optional" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="regEmail" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="regPassword" type="password" placeholder="Min 8 characters" />
    </div>
    <div id="regStatus" class="status"></div>
    <button id="registerBtn" class="btn-primary">Register</button>
    <span id="showLogin" class="toggle-link">Already have an account? Log in</span>
  </div>

  <!-- Main View (logged in) -->
  <div id="mainView" class="hidden">
    <div id="userInfo" class="user-info">
      Logged in as <span id="userEmail" class="email"></span>
    </div>

    <div class="settings">
      <label>Backend URL</label>
      <input id="backendUrl" type="text" value="http://localhost:8000" />
    </div>

    <div id="status" class="status">Open a Google Form and click Fill Form.</div>

    <button id="fillBtn" class="btn-primary">Fill Form</button>
    <button id="extractBtn" class="btn-secondary">Extract Only</button>

    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <input id="testValue" type="text" value="b.tech" style="flex:1; padding:8px; border:1px solid #d1d5db; border-radius:6px; font-size:13px;" placeholder="dropdown value" />
      <button id="testDropdownBtn" style="width:auto; padding:8px 14px; background:#f59e0b; color:white; border-radius:6px; font-size:13px;">Test Dropdown</button>
    </div>

    <button id="logoutBtn" class="btn-danger">Log Out</button>

    <div id="fields" class="fields"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
